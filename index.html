<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro De Veículos</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body>

    <header></header>

    <main>

        <h1 id="tituloPrincipal">Cadastro de Carros</h1>

        <form id="form-carro">

            <div>
                <input id="modeloCarro" type="text" name="modelo" placeholder="Insira o modelo do carro" required>
            </div>
            <div>
                <input id="marcaCarro" type="text" name="marca" placeholder="Insira a marca do carro" required>
            </div>
            <div>
                <input id="anoCarro" type="text" name="ano" placeholder="Insira o ano do carro" required>
            </div>
            <div>
                <input id="corCarro" type="text" name="cor" placeholder="Insira a cor do carro" required>
            </div>
            <div>
                <input id="precoCarro" type="text" inputmode="numeric" name="preco" placeholder="Insira o preço do carro" required>
            </div>

            <input id="btn-enviar" type="submit" value="Enviar">
        
        </form>

        <div>
            <p>Filtra Por Marca</p>
            <input id="filtro-marca" type="text" name="filtro-marca" placeholder="Insira a marca">
            <button id="filtro-por-marca">Filtre Por Marca</button>
        </div>

        <div>
            <div>
                <p>Edita por ID</p>
                <input id="atualiza-carro" type="text" name="filtro-marca" placeholder="Insira o id">
                <button id="selecao-id">Selecionar</button>
            </div>

            <div>
                <p id="titulo-edicao">Edita Cor e Preço</p>
                <input id="atualiza-cor" type="text" name="cor" placeholder="Insira a nova cor">
                <input id="atualiza-preco" type="text" inputmode="numeric" name="preco" placeholder="Insira o novo preco">
                <button id="btn-atualizar">Atualizar</button>
            </div>

            <div>
                <p>Excluir Por ID</p>
                <input id="excluir" type="text" name="excluir" placeholder="Insira o ID para excluir">
                <button id="btn-excluir">Confirmar</button>
            </div>
        </div>

        <ul id="lista-carros"></ul>
    </main>

    <footer></footer>

    <script src="/index.js"></script>
</body>
</html>
